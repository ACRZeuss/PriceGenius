version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pricegenius_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pricegenius_net

  postgres:
    image: postgres:15
    container_name: pricegenius_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: PriceGeniusDb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d PriceGeniusDb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pricegenius_net

volumes:
  rabbitmq_data:
  postgres_data:

networks:
  pricegenius_net:
    driver: bridge